<!doctype html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>加工の進行</title>
<style>
html,body.body-extension{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:#d7d7d7!important;color:#171717!important;font:16px Arial,"Noto Sans JP",sans-serif!important;letter-spacing:0}
#job-display{box-sizing:border-box;width:100%;height:100%;padding:5px 7px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:22px 22px 6px 21px;gap:3px}
#job-display .job-row{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0;line-height:22px;font-size:16px}
#job-display strong{font-size:17px;color:#111;font-variant-numeric:tabular-nums;white-space:nowrap}
#job-display progress{display:block;margin:0;width:100%;height:6px;border:0;background:#aaa;accent-color:#286741}
#job-display progress::-webkit-progress-bar{background:#aaa}#job-display progress::-webkit-progress-value{background:#286741}
#job-display[data-state="一時停止中"] progress{accent-color:#bb901b}#job-display[data-state="一時停止中"] progress::-webkit-progress-value{background:#bb901b}
#job-file{font-size:16px;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<style id="modern-presentation">
html,body.body-extension{background:#fff!important;color:#5e6b7c!important;font-family:-apple-system,BlinkMacSystemFont,Meiryo,sans-serif!important}
#job-display strong{color:#203650;font-weight:650}#job-display progress{background:#e4eaf2;border-radius:3px;overflow:hidden;accent-color:#1764d8}
#job-display progress::-webkit-progress-bar{background:#e4eaf2}#job-display progress::-webkit-progress-value{background:#1764d8}#job-file{color:#647386}
#job-display[data-state="実行ファイルなし"] #job-file{visibility:hidden}
</style></head><body>
<section id="job-display" aria-label="加工の進行">
<div class="job-row" title="標準の進捗はファイルの読み込み割合です。100%でも機械の動作が終わったとは限りません。"><span>進捗（読込）</span><strong id="job-percent">--</strong></div>
<div class="job-row" title="直近の進捗からの概算です。加工内容や送り補正によって大きく変わります。一時停止中、通信途絶、観測不足時は表示しません。"><span>残り目安</span><strong id="job-remaining">--</strong></div>
<progress id="job-progress" max="100" value="0" aria-label="ファイル読み込み進捗"></progress>
<div id="job-file">受信待ち</div>
</section><script>/* JOB_SCRIPT */</script></body></html>
