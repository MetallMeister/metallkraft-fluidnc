# MetallKraft 3020 / Makerbase MKS DLC32 MAX V1.0_002 / FluidNC 4.0.3
# Pin source: Makerbase MKS DLC32 MAX V1.0_002 PIN.pdf (2024-11-04).
# Hardware was disconnected during installation. No motion was tested.
# 800 steps/mm ASSUMES 1.8-degree motors, 1/16 microsteps, 4 mm screw lead.
# Confirm driver current, microstep DIP switches, directions and travel BEFORE use.
# Limits, homing, probe and spindle are deliberately disabled pending wiring checks.
# No UART current control is configured: StepStick current is set on the drivers.

board: MKS-DLC32 MAX V1.0
name: MetallKraft 3020
meta: 2026-09-10 MAX initial setup - uncalibrated

kinematics:
  Cartesian:

stepping:
  engine: Timed
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: gpio.8
  x:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 3000.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 300.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      stepstick:
        step_pin: gpio.16
        direction_pin: gpio.15
  y:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 3000.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 200.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      stepstick:
        step_pin: gpio.7
        direction_pin: gpio.6:low
  z:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 1000.000
    acceleration_mm_per_sec2: 60.000
    max_travel_mm: 70.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      stepstick:
        step_pin: gpio.5
        direction_pin: gpio.4

# SD SPI: DAT0=MISO, CMD=MOSI, CLK=SCK, DAT3=CS.
spi:
  miso_pin: gpio.12
  mosi_pin: gpio.14
  sck_pin: gpio.13
sdcard:
  cs_pin: gpio.21
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN

probe:
  pin: NO_PIN
  check_mode_start: true

start:
  must_home: false
  check_limits: true

verbose_errors: true
